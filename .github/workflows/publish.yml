name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token needed. Configure the
      # trusted publisher for each of returnz / returnz-pydantic / returnz-fastapi
      # at https://pypi.org/manage/account/publishing/ before the first release.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Build all packages
        run: uv build --all-packages

      - name: Publish to PyPI
        run: uv publish
