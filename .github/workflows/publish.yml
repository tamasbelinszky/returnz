name: Publish

on:
  push:
    tags: ["v*"]

jobs:
  publish:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - package: returnz
            environment: pypi
          - package: returnz-pydantic
            environment: pypi-pydantic
          - package: returnz-fastapi
            environment: pypi-fastapi
    environment: ${{ matrix.environment }}
    permissions:
      # PyPI Trusted Publishing (OIDC) — no API token stored. Each package gets its
      # own environment because PyPI keys a *pending* publisher on
      # (owner, repo, workflow, environment) and requires that tuple to be unique.
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Verify package versions match tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import os
          import tomllib

          expected = os.environ["RELEASE_TAG"].removeprefix("v")
          paths = (
              "packages/core/pyproject.toml",
              "packages/pydantic/pyproject.toml",
              "packages/fastapi/pyproject.toml",
          )
          versions = {
              path: tomllib.load(open(path, "rb"))["project"]["version"] for path in paths
          }
          if set(versions.values()) != {expected}:
              raise SystemExit(f"tag {expected}; package versions {versions}")
          PY

      - name: Build ${{ matrix.package }}
        run: uv build --package ${{ matrix.package }}

      - name: Publish ${{ matrix.package }} to PyPI
        run: uv publish
