name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.14"

      - name: Sync workspace
        run: uv sync --all-packages

      - name: Ruff lint
        run: uv run ruff check .

      - name: Ruff format
        run: uv run ruff format --check .

      - name: ty (primary type checker)
        run: uv run ty check

      - name: pyright (consumer-conformance gate)
        run: uv run pyright

      - name: mypy (plugin-free conformance gate)
        run: uv run mypy packages/core/src packages/pydantic/src packages/fastapi/src

      - name: pytest
        run: uv run pytest
