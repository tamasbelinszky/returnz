[project]
name = "returnz"
version = "0.0.0"
description = "Result / Maybe / Reader for modern Python — concrete generics, no HKT, no type-checker plugin."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Tamás Belinszky", email = "tamasbelinszky@gmail.com" }]
keywords = ["result", "maybe", "option", "reader", "railway", "functional", "error-handling"]
dependencies = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returnz"]
