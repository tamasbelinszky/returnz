[project]
name = "returnz-pydantic"
version = "0.0.0"
description = "Pydantic v2 integration for returnz — tagged-envelope serialization, parse() boundary, tagged errors."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Tamás Belinszky", email = "tamasbelinszky@gmail.com" }]
dependencies = [
    "returnz",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returnz_pydantic"]

[tool.uv.sources]
returnz = { workspace = true }
