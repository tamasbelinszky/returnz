[project]
name = "returnz-fastapi"
version = "0.1.4"
description = "FastAPI + Pydantic integration for returnz — Results on the wire, typed error boundaries."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Tamás Belinszky" }]
keywords = ["returnz", "fastapi", "result", "http", "error-handling"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "returnz>=0.1.0",
    "returnz-pydantic>=0.1.2",
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[project.urls]
Homepage = "https://github.com/tamasbelinszky/returnz"
Repository = "https://github.com/tamasbelinszky/returnz"
Issues = "https://github.com/tamasbelinszky/returnz/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returnz_fastapi"]

[tool.uv.sources]
returnz = { workspace = true }
returnz-pydantic = { workspace = true }
