[project]
name = "returnz-fastapi"
version = "0.0.0"
description = "FastAPI + Pydantic integration for returnz — Results on the wire, typed error boundaries."
readme = "README.md"
requires-python = ">=3.14"
license = "MIT"
authors = [{ name = "Tamás Belinszky", email = "tamasbelinszky@gmail.com" }]
dependencies = [
    "returnz",
    "fastapi>=0.115",
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/returnz_fastapi"]

[tool.uv.sources]
returnz = { workspace = true }
